name: Windows lightweight server

on:
  push:
    branches:
      - main
      - "agent/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Windows x64 ZIP
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install frontend build dependencies
        run: npm ci

      - name: Check and test static frontend
        run: |
          npm run lint
          npm test

      - name: Check and test Rust server
        run: |
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo test --locked --manifest-path server/Cargo.toml
          cargo build --locked --release --manifest-path server/Cargo.toml

      - name: Assemble standalone package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $packageDirectory = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $packageDirectory "scripts") -Force | Out-Null

          Copy-Item "server/target/release/cgv-gift-server.exe" $packageDirectory
          Copy-Item "server-dist" (Join-Path $packageDirectory "web") -Recurse
          Copy-Item @(
            "browser-settings.json",
            "start-local.bat",
            "reset-data.bat",
            "clean-uninstall.bat",
            "README_사용법.md"
          ) $packageDirectory
          Copy-Item @(
            "scripts/browser.ps1",
            "scripts/start-server.ps1",
            "scripts/open-admin.ps1",
            "scripts/display-window.ps1",
            "scripts/reset-data.ps1",
            "scripts/clean-uninstall.ps1"
          ) (Join-Path $packageDirectory "scripts")

          Get-ChildItem $packageDirectory -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$($_.Name): $($errors | ForEach-Object Message | Out-String)"
            }
          }

          $forbiddenRuntime = Get-ChildItem $packageDirectory -Recurse |
            Where-Object {
              $_.Name -match "^(node_modules|node|npm|npx|tauri)(\.exe|\.cmd)?$"
            }
          if ($forbiddenRuntime) {
            throw "Package contains a forbidden runtime: $($forbiddenRuntime.FullName)"
          }

          $installedBytes = (
            Get-ChildItem $packageDirectory -Recurse -File |
              Measure-Object Length -Sum
          ).Sum
          $limit = 25MB
          $sizeMiB = [math]::Round($installedBytes / 1MB, 2)
          if ($installedBytes -gt $limit) {
            throw "Package is $sizeMiB MiB and exceeds the 25 MiB target."
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display-windows-x64-v$version.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $zipPath
          (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash |
            Set-Content -LiteralPath "$zipPath.sha256" -Encoding ascii

          "directory=$packageDirectory" >> $env:GITHUB_OUTPUT
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "### Windows package" >> $env:GITHUB_STEP_SUMMARY
          "- Uncompressed: **$sizeMiB MiB** / 25 MiB" >> $env:GITHUB_STEP_SUMMARY
          "- Runtime: **single Rust server + installed Edge/Chrome**" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify packaged runtime and SQLite
        shell: pwsh
        run: |
          $packageDirectory = "${{ steps.package.outputs.directory }}"
          $runtimeLocalAppData = Join-Path $env:RUNNER_TEMP "cgv-server-local-app-data"
          New-Item -ItemType Directory -Path $runtimeLocalAppData -Force | Out-Null
          $env:LOCALAPPDATA = $runtimeLocalAppData
          $application = Join-Path $packageDirectory "cgv-gift-server.exe"
          $process = Start-Process $application -ArgumentList "--no-open" -PassThru

          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              Start-Sleep -Milliseconds 25
              if ($process.HasExited) {
                throw "Server exited during startup."
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:3210/health" -TimeoutSec 1
                if ($health.ok) { break }
              } catch {}
            }
            if (-not $health.ok) {
              throw "Server was not ready within two seconds."
            }
            if ([int]$health.startupMs -gt 300) {
              throw "Server startupMs was $($health.startupMs), over the 300 ms target."
            }

            $html = Invoke-WebRequest "http://127.0.0.1:3210/" -UseBasicParsing
            if ($html.Content -notmatch "CGV 구로 경품 관리") {
              throw "Packaged static frontend was not served."
            }

            $payload = @{
              items = @()
              settings = @{
                location = "구로"
                title = "경품 안내"
                notices = @()
                pageSeconds = 8
                showSoldout = $true
              }
              updatedAt = "2026-08-13T00:00:00.000Z"
            } | ConvertTo-Json -Depth 5
            Invoke-RestMethod "http://127.0.0.1:3210/data" -Method Post -ContentType "application/json" -Body $payload
            $stored = Invoke-RestMethod "http://127.0.0.1:3210/data"
            if ($stored.data.settings.location -ne "구로") {
              throw "SQLite round trip failed."
            }
            $database = Join-Path $runtimeLocalAppData "CGVGiftDisplay\inventory.db"
            if (-not (Test-Path -LiteralPath $database)) {
              throw "Database was not created at $database."
            }

            "### Runtime verification" >> $env:GITHUB_STEP_SUMMARY
            "- Server ready: **$($health.startupMs) ms** / 300 ms" >> $env:GITHUB_STEP_SUMMARY
            "- Static frontend: **passed**" >> $env:GITHUB_STEP_SUMMARY
            "- SQLite round trip: **passed**" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-x64
          path: release-artifact

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-artifact/* --generate-notes --title "${{ github.ref_name }}"
