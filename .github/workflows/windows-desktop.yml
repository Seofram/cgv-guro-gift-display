name: Windows desktop

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "app/**"
      - "public/**"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.desktop.json"
      - "vite.desktop.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC and NSIS
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check shared desktop frontend
        run: npm run desktop:check

      - name: Test Rust desktop backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Enforce 50 MiB installer limit
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not created."
          }

          $limit = 50MB
          $sizeMiB = [math]::Round($installer.Length / 1MB, 2)
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "size_mib=$sizeMiB" >> $env:GITHUB_OUTPUT
          "### Windows desktop package" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: ``$($installer.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: **$sizeMiB MiB** / 50 MiB" >> $env:GITHUB_STEP_SUMMARY

          if ($installer.Length -gt $limit) {
            throw "Installer is $sizeMiB MiB and exceeds the 50 MiB target."
          }

      - name: Verify warm startup is under two seconds
        shell: pwsh
        run: |
          $application = Resolve-Path "src-tauri/target/release/cgv-guro-gift-display.exe"

          function Measure-FirstWindow([string] $path, [int] $timeoutMs = 15000) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $path -PassThru

            while ($timer.ElapsedMilliseconds -lt $timeoutMs) {
              Start-Sleep -Milliseconds 25
              $process.Refresh()
              if ($process.HasExited) {
                throw "Desktop application exited before creating its main window."
              }
              if ($process.MainWindowHandle -ne 0) {
                $timer.Stop()
                return @{
                  Process = $process
                  StartupMs = $timer.ElapsedMilliseconds
                }
              }
            }

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Desktop application did not create a main window within $timeoutMs ms."
          }

          function Stop-DesktopApplication($measurement) {
            $measurement.Process.CloseMainWindow() | Out-Null
            if (-not $measurement.Process.WaitForExit(5000)) {
              $measurement.Process.Kill()
              $measurement.Process.WaitForExit()
            }
          }

          $cold = Measure-FirstWindow $application
          Stop-DesktopApplication $cold
          Start-Sleep -Milliseconds 250

          $warm = Measure-FirstWindow $application
          Stop-DesktopApplication $warm

          "### Windows startup measurement" >> $env:GITHUB_STEP_SUMMARY
          "- First launch: **$($cold.StartupMs) ms**" >> $env:GITHUB_STEP_SUMMARY
          "- General restart: **$($warm.StartupMs) ms** / 2000 ms" >> $env:GITHUB_STEP_SUMMARY

          if ($warm.StartupMs -gt 2000) {
            throw "General restart took $($warm.StartupMs) ms and exceeds the 2000 ms target."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-${{ github.sha }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
