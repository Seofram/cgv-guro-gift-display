name: Windows desktop

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "app/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.desktop.json"
      - "vite.desktop.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC and NSIS
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate operating PC verification script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/verify-desktop-install.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object Message | Out-String)
          }

      - name: Check shared desktop frontend
        run: npm run desktop:check

      - name: Test Rust desktop backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Enforce 50 MiB installer limit
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not created."
          }

          $limit = 50MB
          $sizeMiB = [math]::Round($installer.Length / 1MB, 2)
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "size_mib=$sizeMiB" >> $env:GITHUB_OUTPUT
          "### Windows desktop package" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: ``$($installer.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: **$sizeMiB MiB** / 50 MiB" >> $env:GITHUB_STEP_SUMMARY

          if ($installer.Length -gt $limit) {
            throw "Installer is $sizeMiB MiB and exceeds the 50 MiB target."
          }

      - name: Install package and verify standalone runtime
        id: installed
        shell: pwsh
        run: |
          $installer = "${{ steps.installer.outputs.path }}"
          $installDirectory = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display-installed"
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/S",
            "/D=$installDirectory"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installation failed with exit code $($install.ExitCode)."
          }

          $application = Get-ChildItem $installDirectory -Recurse -File |
            Where-Object Name -eq "cgv-guro-gift-display.exe" |
            Select-Object -First 1
          if (-not $application) {
            throw "The installed desktop executable was not found."
          }

          $forbiddenRuntime = Get-ChildItem $installDirectory -Recurse -File |
            Where-Object Name -Match "^(node|npm|npx|chrome|msedge)(\.exe|\.cmd)?$"
          if ($forbiddenRuntime) {
            throw "Standalone package contains a forbidden runtime: $($forbiddenRuntime.FullName)"
          }

          $installedBytes = (
            Get-ChildItem $installDirectory -Recurse -File |
              Measure-Object Length -Sum
          ).Sum
          $installedMiB = [math]::Round($installedBytes / 1MB, 2)
          if ($installedBytes -gt 50MB) {
            throw "Installed footprint is $installedMiB MiB and exceeds the 50 MiB target."
          }

          "application=$($application.FullName)" >> $env:GITHUB_OUTPUT
          "directory=$installDirectory" >> $env:GITHUB_OUTPUT
          "### Installed desktop runtime" >> $env:GITHUB_STEP_SUMMARY
          "- Installed footprint: **$installedMiB MiB** / 50 MiB" >> $env:GITHUB_STEP_SUMMARY
          "- Bundled Node/npm/browser runtime: **none**" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify hydrated warm startup is under two seconds
        shell: pwsh
        run: |
          $application = "${{ steps.installed.outputs.application }}"
          $runtimeLocalAppData = Join-Path $env:RUNNER_TEMP "cgv-runtime-local-app-data"
          New-Item -ItemType Directory -Path $runtimeLocalAppData -Force | Out-Null
          $originalLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $runtimeLocalAppData
          $readyTitle = "CGV 구로 경품 관리"

          function Measure-ReadyScreen([string] $path, [int] $timeoutMs = 15000) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $path -PassThru

            while ($timer.ElapsedMilliseconds -lt $timeoutMs) {
              Start-Sleep -Milliseconds 25
              $process.Refresh()
              if ($process.HasExited) {
                throw "Desktop application exited before creating its main window."
              }
              if ($process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -eq $readyTitle) {
                $timer.Stop()
                return @{
                  Process = $process
                  StartupMs = $timer.ElapsedMilliseconds
                }
              }
            }

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Desktop application did not finish loading its management screen within $timeoutMs ms."
          }

          function Stop-DesktopApplication($measurement) {
            $measurement.Process.CloseMainWindow() | Out-Null
            if (-not $measurement.Process.WaitForExit(5000)) {
              $measurement.Process.Kill()
              $measurement.Process.WaitForExit()
            }
          }

          try {
            # A fresh hosted runner can spend extra time provisioning WebView2 on
            # the first launch. Keep that one-time cost separate from the warm
            # restart target that users experience during normal operation.
            $cold = Measure-ReadyScreen $application 45000
            $listeners = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object OwningProcess -eq $cold.Process.Id
            if ($listeners) {
              throw "Desktop application opened a local listening port."
            }
            Stop-DesktopApplication $cold
            Start-Sleep -Milliseconds 250

            $database = Join-Path $runtimeLocalAppData "CGVGiftDisplay\inventory.db"
            if (-not (Test-Path $database)) {
              throw "The legacy-compatible inventory database was not created at $database."
            }

            $warm = Measure-ReadyScreen $application 15000
            Stop-DesktopApplication $warm

            "First hydrated screen: $($cold.StartupMs) ms"
            "General hydrated restart: $($warm.StartupMs) ms"
            "### Windows startup measurement" >> $env:GITHUB_STEP_SUMMARY
            "- First hydrated screen: **$($cold.StartupMs) ms**" >> $env:GITHUB_STEP_SUMMARY
            "- General hydrated restart: **$($warm.StartupMs) ms** / 2000 ms" >> $env:GITHUB_STEP_SUMMARY
            "- Local listening server: **none**" >> $env:GITHUB_STEP_SUMMARY
            "- SQLite path: ``%LOCALAPPDATA%\CGVGiftDisplay\inventory.db``" >> $env:GITHUB_STEP_SUMMARY

            if ($warm.StartupMs -gt 2000) {
              throw "General hydrated restart took $($warm.StartupMs) ms and exceeds the 2000 ms target."
            }
          } finally {
            $env:LOCALAPPDATA = $originalLocalAppData
          }

      - name: Prepare operating PC verification kit
        id: verification-kit
        shell: pwsh
        run: |
          $kitDirectory = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display-verification-kit"
          New-Item -ItemType Directory -Path $kitDirectory -Force | Out-Null

          $installer = "${{ steps.installer.outputs.path }}"
          Copy-Item -LiteralPath $installer -Destination $kitDirectory
          Copy-Item -LiteralPath "scripts/verify-desktop-install.ps1" -Destination $kitDirectory
          Copy-Item -LiteralPath "README_사용법.md" -Destination $kitDirectory

          $installerHash = Get-FileHash -LiteralPath $installer -Algorithm SHA256
          "$($installerHash.Hash)  $($installerHash.Path | Split-Path -Leaf)" |
            Set-Content -LiteralPath (Join-Path $kitDirectory "SHA256SUMS.txt") -Encoding ascii

          "path=$kitDirectory" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer and verification kit
        uses: actions/upload-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-${{ github.sha }}
          path: ${{ steps.verification-kit.outputs.path }}
          if-no-files-found: error
          retention-days: 14
