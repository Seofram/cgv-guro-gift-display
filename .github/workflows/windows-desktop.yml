name: Windows PowerShell runtime

on:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-powershell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify EXE-free Windows ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Check and test static frontend
        run: |
          npm run lint
          npm test

      - name: Assemble EXE-free package with PowerShell 5 encoding
        id: package
        shell: powershell
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $packageDirectory = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $packageDirectory "scripts") -Force | Out-Null
          Copy-Item "server-dist" (Join-Path $packageDirectory "web") -Recurse
          Copy-Item @(
            "browser-settings.json", "start-local.bat", "reset-data.bat",
            "clean-uninstall.bat", "README_사용법.md"
          ) $packageDirectory
          Copy-Item @(
            "scripts/browser.ps1", "scripts/server-process.ps1",
            "scripts/sqlite-store.ps1", "scripts/local-server.ps1",
            "scripts/start-server.ps1", "scripts/open-admin.ps1",
            "scripts/display-window.ps1", "scripts/reset-data.ps1",
            "scripts/clean-uninstall.ps1"
          ) (Join-Path $packageDirectory "scripts")

          Get-ChildItem $packageDirectory -Recurse -Filter *.ps1 | ForEach-Object {
            $content = [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8)
            [IO.File]::WriteAllText(
              $_.FullName, $content, (New-Object Text.UTF8Encoding($true))
            )
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if (
              $bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or
              $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF
            ) { throw "$($_.Name) does not have a UTF-8 BOM." }
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$($_.Name): $($errors | ForEach-Object Message | Out-String)"
            }
          }

          $forbiddenRuntime = Get-ChildItem $packageDirectory -Recurse |
            Where-Object {
              $_.Extension -eq ".exe" -or
              $_.Name -match "^(node_modules|node|npm|npx|tauri)(\.exe|\.cmd)?$"
            }
          if ($forbiddenRuntime) {
            throw "Forbidden executable/runtime: $($forbiddenRuntime.FullName)"
          }
          $installedBytes = (
            Get-ChildItem $packageDirectory -Recurse -File |
              Measure-Object Length -Sum
          ).Sum
          $limit = 10MB
          $sizeMiB = [math]::Round($installedBytes / 1MB, 2)
          if ($installedBytes -gt $limit) {
            throw "Package is $sizeMiB MiB and exceeds 10 MiB."
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display-windows-x64-v$version.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $zipPath
          (Get-FileHash $zipPath -Algorithm SHA256).Hash |
            Set-Content "$zipPath.sha256" -Encoding ascii
          "directory=$packageDirectory" >> $env:GITHUB_OUTPUT
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "### Windows PowerShell package" >> $env:GITHUB_STEP_SUMMARY
          "- Uncompressed: **$sizeMiB MiB** / 10 MiB" >> $env:GITHUB_STEP_SUMMARY
          "- Bundled EXE/Node/Tauri: **none**" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify PowerShell 5 server and existing SQLite schema
        shell: powershell
        run: |
          $packageDirectory = "${{ steps.package.outputs.directory }}"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "cgv-powershell-local-app-data"
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          $env:LOCALAPPDATA = $runtimeRoot
          $serverScript = Join-Path $packageDirectory "scripts\local-server.ps1"
          function Start-TestServer {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process powershell.exe -ArgumentList @(
              "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass",
              "-File", ('"' + $serverScript + '"'), "-NoOpen"
            ) -WindowStyle Hidden -PassThru
            $health = $null
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              Start-Sleep -Milliseconds 50
              if ($process.HasExited) {
                $log = Join-Path $runtimeRoot "CGVGiftDisplay\server-error.log"
                $detail = if (Test-Path $log) { Get-Content -Raw $log } else { "no log" }
                throw "PowerShell server exited: $detail"
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:3210/health" -TimeoutSec 1
                if ($health.ok) { break }
              } catch {}
            }
            $timer.Stop()
            if (-not $health.ok) { throw "Server was not ready in four seconds." }
            if ($health.runtime -ne "powershell") { throw "Unexpected runtime." }
            if ($timer.ElapsedMilliseconds -gt 3000) {
              throw "Ready time exceeded 3000 ms: $($timer.ElapsedMilliseconds)"
            }
            return @{
              Process = $process
              ReadyMs = $timer.ElapsedMilliseconds
              StartupMs = $health.startupMs
            }
          }

          $first = Start-TestServer
          try {
            $html = Invoke-WebRequest "http://127.0.0.1:3210/" -UseBasicParsing
            if ($html.Content -notmatch "CGV 구로 경품 관리") {
              throw "Static frontend was not served."
            }
            $payload = @{
              items = @()
              settings = @{
                location = "구로"; title = "경품 안내"; notices = @()
                pageSeconds = 8; showSoldout = $true
              }
              updatedAt = "2026-08-13T00:00:00.000Z"
            } | ConvertTo-Json -Depth 5
            $postArguments = @{
              Uri = "http://127.0.0.1:3210/data"
              Method = "Post"
              ContentType = "application/json; charset=utf-8"
              Body = $payload
            }
            Invoke-RestMethod @postArguments
            $stored = Invoke-RestMethod "http://127.0.0.1:3210/data"
            if ($stored.data.settings.location -ne "구로") {
              throw "SQLite round trip failed."
            }
            $database = Join-Path $runtimeRoot "CGVGiftDisplay\inventory.db"
            $bytes = [IO.File]::ReadAllBytes($database)
            $expectedHeader = "SQLite format 3" + [char]0
            if ([Text.Encoding]::ASCII.GetString($bytes, 0, 16) -ne $expectedHeader) {
              throw "SQLite file format was not preserved."
            }
          } finally {
            Stop-Process -Id $first.Process.Id -Force -ErrorAction SilentlyContinue
            $first.Process.WaitForExit()
          }

          Start-Sleep -Milliseconds 300
          $second = Start-TestServer
          try {
            $stored = Invoke-RestMethod "http://127.0.0.1:3210/data"
            if ($stored.data.updatedAt -ne "2026-08-13T00:00:00.000Z") {
              throw "Data did not survive restart."
            }
            "### Runtime verification" >> $env:GITHUB_STEP_SUMMARY
            "- First ready: **$($first.ReadyMs) ms** / 3000 ms" >> $env:GITHUB_STEP_SUMMARY
            "- Restart ready: **$($second.ReadyMs) ms** / 3000 ms" >> $env:GITHUB_STEP_SUMMARY
            "- Script startup: **$($second.StartupMs) ms**" >> $env:GITHUB_STEP_SUMMARY
            "- SQLite write/read/restart: **passed**" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime: **Windows PowerShell 5.1**" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            Stop-Process -Id $second.Process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-x64
          path: release-artifact
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-artifact/* --repo "${{ github.repository }}" --generate-notes --title "${{ github.ref_name }}"
