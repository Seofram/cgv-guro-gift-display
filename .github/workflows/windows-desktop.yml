name: Windows PowerShell runtime

on:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-powershell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify EXE-free Windows ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Check and test static frontend
        run: |
          npm run lint
          npm test

      - name: Assemble EXE-free package with PowerShell 5 encoding
        id: package
        shell: powershell
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version."
          }
          $packageDirectory = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $packageDirectory "scripts") -Force | Out-Null
          Copy-Item "server-dist" (Join-Path $packageDirectory "web") -Recurse
          Copy-Item @(
            "browser-settings.json", "start-local.bat", "reset-data.bat",
            "clean-uninstall.bat"
          ) $packageDirectory
          Copy-Item (Get-ChildItem -File "README_*.md") $packageDirectory
          Copy-Item @(
            "scripts/browser.ps1", "scripts/server-process.ps1",
            "scripts/sqlite-store.ps1", "scripts/local-server.ps1",
            "scripts/start-server.ps1", "scripts/open-admin.ps1",
            "scripts/display-window.ps1", "scripts/reset-data.ps1",
            "scripts/clean-uninstall.ps1"
          ) (Join-Path $packageDirectory "scripts")

          Get-ChildItem $packageDirectory -Recurse -Filter *.ps1 | ForEach-Object {
            $content = [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8)
            [IO.File]::WriteAllText(
              $_.FullName, $content, (New-Object Text.UTF8Encoding($true))
            )
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if (
              $bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or
              $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF
            ) { throw "$($_.Name) does not have a UTF-8 BOM." }
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$($_.Name): $($errors | ForEach-Object Message | Out-String)"
            }
          }

          $forbiddenRuntime = Get-ChildItem $packageDirectory -Recurse |
            Where-Object {
              $_.Extension -eq ".exe" -or
              $_.Name -match "^(node_modules|node|npm|npx|tauri)(\.exe|\.cmd)?$"
            }
          if ($forbiddenRuntime) {
            throw "Forbidden executable/runtime: $($forbiddenRuntime.FullName)"
          }
          $installedBytes = (
            Get-ChildItem $packageDirectory -Recurse -File |
              Measure-Object Length -Sum
          ).Sum
          $limit = 10MB
          $sizeMiB = [math]::Round($installedBytes / 1MB, 2)
          if ($installedBytes -gt $limit) {
            throw "Package is $sizeMiB MiB and exceeds 10 MiB."
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "cgv-guro-gift-display-windows-x64-v$version.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $zipPath
          (Get-FileHash $zipPath -Algorithm SHA256).Hash |
            Set-Content "$zipPath.sha256" -Encoding ascii
          "directory=$packageDirectory" >> $env:GITHUB_OUTPUT
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "### Windows PowerShell package" >> $env:GITHUB_STEP_SUMMARY
          "- Uncompressed: **$sizeMiB MiB** / 10 MiB" >> $env:GITHUB_STEP_SUMMARY
          "- Bundled EXE/Node/Tauri: **none**" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify PowerShell 5 server, concurrency, backups and migration
        shell: powershell
        run: |
          # Starts the packaged server several times against an isolated data
          # directory: v1.5.0 database migration, optimistic concurrency,
          # request-origin checks, SQLite snapshot backups, restore, restart
          # and downgrade. See tests/windows/verify-runtime.ps1.
          $result = & "tests\windows\verify-runtime.ps1" `
            -PackageDirectory "${{ steps.package.outputs.directory }}" `
            -RuntimeRoot (Join-Path $env:RUNNER_TEMP "cgv-powershell-local-app-data")
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($result.Version -ne $version) {
            throw "Server reports version $($result.Version), expected $version."
          }
          foreach ($ready in @($result.FirstReadyMs, $result.RestartReadyMs)) {
            if ($ready -gt 3000) { throw "Ready time exceeded 3000 ms: $ready" }
          }
          "### Runtime verification" >> $env:GITHUB_STEP_SUMMARY
          "- First ready (with v1.5.0 migration): **$($result.FirstReadyMs) ms** / 3000 ms" >> $env:GITHUB_STEP_SUMMARY
          "- Restart ready: **$($result.RestartReadyMs) ms** / 3000 ms" >> $env:GITHUB_STEP_SUMMARY
          "- Script startup: **$($result.StartupMs) ms**" >> $env:GITHUB_STEP_SUMMARY
          "- Runtime checks passed: **$($result.Checks)**" >> $env:GITHUB_STEP_SUMMARY
          "- Runtime: **Windows PowerShell 5.1**" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-x64
          path: release-artifact
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # A release created by hand before this job runs receives the
          # CI-built assets instead of failing the job.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifact/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release-artifact/* --repo "$REPO" --generate-notes --title "$TAG"
          fi
