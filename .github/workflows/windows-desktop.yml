name: Windows desktop

on:
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "app/**"
      - "public/**"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.desktop.json"
      - "vite.desktop.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC and NSIS
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check shared desktop frontend
        run: npm run desktop:check

      - name: Check Rust desktop backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Enforce 50 MiB installer limit
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not created."
          }

          $limit = 50MB
          $sizeMiB = [math]::Round($installer.Length / 1MB, 2)
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "size_mib=$sizeMiB" >> $env:GITHUB_OUTPUT
          "### Windows desktop package" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: ``$($installer.Name)``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: **$sizeMiB MiB** / 50 MiB" >> $env:GITHUB_STEP_SUMMARY

          if ($installer.Length -gt $limit) {
            throw "Installer is $sizeMiB MiB and exceeds the 50 MiB target."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cgv-guro-gift-display-windows-${{ github.sha }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
